<div class="dashboard">
    <section class="glass-card" style="grid-column: span 2; margin-bottom: 20px; text-align: center;">
        <h1 style="font-size: 2.2rem; margin-bottom: 10px; color: #60a5fa;">Predictive Risk Analysis</h1>
        <p style="font-size: 1rem; opacity: 0.8; margin: 0 auto;">
            Use our AI model to predict accident severity based on location, vehicle type, and weather conditions.
        </p>
    </section>

    <div class="controls glass-card">
        <h2>Accident Parameters</h2>
        
        <label for="locationSelect">Accident Location</label>
        <select id="locationSelect">
            <option value="Koramangala">Koramangala (Urban)</option>
            <option value="Hebbal">Hebbal Flyover (High Traffic)</option>
            <option value="NiceRoad">NICE Road (Expressway)</option>
            <option value="Indiranagar">Indiranagar (Commercial)</option>
        </select>

        <label for="weatherSelect">Weather Condition</label>
        <select id="weatherSelect">
            <option value="Clear">Clear / Sunny</option>
            <option value="Rain">Heavy Rain / Wet</option>
            <option value="Fog">Fog / Low Visibility</option>
        </select>

        <label for="vehicleSelect">Vehicle Type</label>
        <select id="vehicleSelect">
            <option value="Car">Passenger Car</option>
            <option value="Motorcycle">Motorcycle / Scooter</option>
            <option value="Truck">Heavy Truck</option>
            <option value="Bus">Bus</option>
        </select>

        <label>Vehicle Speed (km/h)</label>
        <div class="speed-display">
            <span id="speedValueDisplay">40</span> 
            <span style="font-size:1rem; color:#64748b;">km/h</span>
        </div>
        <input type="range" id="speedRange" min="0" max="140" value="40" oninput="document.getElementById('speedValueDisplay').innerText = this.value">

        <button onclick="runComplexPrediction()">RUN AI PREDICTION</button>
    </div>

    <div class="results-panel glass-card">
        <h3>Prediction Result</h3>
        
        <div id="riskResultContainer" class="result-container">
            <div class="risk-circle">
                <span id="riskScore" class="risk-score">--</span>
                <div class="risk-label">RISK SCORE</div>
            </div>
            <h2 id="predictionResult" style="color:white; margin-top:10px;">Waiting...</h2>
        </div>

        <div id="terminal" class="terminal">
            <div class="log-line">> System Ready...</div>
            <div class="log-line">> XGBoost Model Loaded (v2.4)</div>
        </div>
    </div>
</div>
